<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House | Syoma Zharkov</title>
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <link rel="stylesheet" href="../css/uikit.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="house-page uk-light">
    <div class="house-container">
        <header class="house-header">
            <a class="uk-logo" href="/" aria-label="Syoma home">SYOMA</a>
            <a class="uk-button-text uk-text-decoration-none" href="/">Back home</a>
        </header>

        <main>
            <h1>House</h1>

            <section aria-labelledby="construction-heading">
                <h2 id="construction-heading">Construction</h2>
                <div class="house-gallery">
                    <a href="../subpage/house_pics/construction1.jpg">
                        <img src="../subpage/house_pics/construction1.jpg" width="1280" height="960" alt="Stone house with exposed roof framing and snowy mountains behind it">
                    </a>
                    <a href="../subpage/house_pics/construction2.jpg">
                        <img src="../subpage/house_pics/construction2.jpg" width="960" height="1280" loading="lazy" alt="Timber frame being raised beside the house in the fog">
                    </a>
                    <a href="../subpage/house_pics/construction3.jpg">
                        <img src="../subpage/house_pics/construction3.jpg" width="964" height="1280" loading="lazy" alt="Two people working on the roof above the stone walls">
                    </a>
                    <a href="../subpage/house_pics/construction4.jpg">
                        <img src="../subpage/house_pics/construction4.jpg" width="1280" height="964" loading="lazy" alt="Workers lifting a wooden beam inside the house frame">
                    </a>
                    <a href="../subpage/house_pics/construction5.jpg">
                        <img src="../subpage/house_pics/construction5.jpg" width="960" height="1280" loading="lazy" alt="Exposed timber posts and roof beams viewed from below">
                    </a>
                    <a href="../subpage/house_pics/construction6.jpg">
                        <img src="../subpage/house_pics/construction6.jpg" width="960" height="1280" loading="lazy" alt="House exterior with timber framing, wooden siding, and a metal roof">
                    </a>
                </div>
            </section>

            <section aria-labelledby="views-heading">
                <h2 id="views-heading">Views</h2>
                <div class="house-gallery">
                    <a href="../subpage/house_pics/view1.jpg">
                        <img src="../subpage/house_pics/view1.jpg" width="1280" height="964" loading="lazy" alt="Village rooftops below green slopes and snow-capped mountains">
                    </a>
                    <a href="../subpage/house_pics/view2.jpg">
                        <img src="../subpage/house_pics/view2.jpg" width="1280" height="720" loading="lazy" alt="Two hikers posing in a meadow beneath snowy mountain cliffs">
                    </a>
                    <a href="../subpage/house_pics/view3.jpg">
                        <img src="../subpage/house_pics/view3.jpg" width="1280" height="960" loading="lazy" alt="Snow-covered trees and a mountain peak under a blue sky">
                    </a>
                    <a href="../subpage/house_pics/view4.jpg">
                        <img src="../subpage/house_pics/view4.jpg" width="1280" height="960" loading="lazy" alt="A person sitting by an opening in the timber-framed loft">
                    </a>
                    <a href="../subpage/house_pics/view5.jpg">
                        <img src="../subpage/house_pics/view5.jpg" width="1280" height="960" loading="lazy" alt="Mist filling the mountain valley beyond the village rooftops">
                    </a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
