<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garment</title>
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .gallery img {
            width: 50%;
            max-width: 300px;
            height: auto;
        }
        .text-box {
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            width: 50%;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>I usually sew gifts and give them away to my friends so I don't actually have that many images of all my creations lol</h1>

    <!-- YouTube only allows /embed/ URLs inside frames (a /watch URL renders as a blocked box). -->
    <iframe width="100%" height="450" src="https://www.youtube.com/embed/pN2iV89kHsw" title="YouTube video of me sewing" style="border: 0;" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <a href="https://www.youtube.com/watch?v=pN2iV89kHsw&t=33s" target="_blank">silly YouTube video of me sewing</a>
    <div class="gallery">
        <img src="garment1.png" alt="Garment 1">
        <img src="garment2.png" alt="Garment 2">
        <img src="garment3.png" alt="Garment 3">
        <img src="garment4.png" alt="Garment 4">
        <img src="garment5.png" alt="Garment 5">
        <img src="garment6.png" alt="Garment 6">
    </div>

    <div class="text-box">
        <p>DRESSES: coming soon</p>
    </div>
</body>
</html>
